name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-demo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Pester tests (PowerShell 7)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $config

      - name: Setup check of the example configuration (Windows PowerShell 5.1)
        if: success() || failure()
        shell: powershell
        run: |
          ./Setup.ps1 -Demo -NonInteractive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Demo run, every complaint of the period, then a second run that resumes (PowerShell 7)
        # Runs after failed tests too, so the demo reports are available for debugging.
        if: success() || failure()
        shell: pwsh
        run: |
          ./Invoke-ComplaintDossier.ps1 -Demo -OutputPath out/demo -NoOpen
          $reports = @(Get-ChildItem out/demo/reports -Filter *-DRAFT.docx)
          if ($reports.Count -ne 10) { throw "Expected 10 draft reports, found $($reports.Count)." }
          $again = ./Invoke-ComplaintDossier.ps1 -Demo -OutputPath out/demo -PassThru
          if (@($again.Complaints | Where-Object state -eq 'generated').Count) { throw 'The second run generated reports again.' }
          $reports | ForEach-Object { $_.FullName }

      - name: Sample run of two complaints for docs/sample (PowerShell 7)
        if: success() || failure()
        shell: pwsh
        run: ./Invoke-ComplaintDossier.ps1 -Demo -CaseId SYN-2026-006,SYN-2026-007 -OutputPath out/sample -NoOpen

      - name: The two commands as a QA user starts them (Setup.cmd and Run.cmd, Windows PowerShell 5.1)
        if: success() || failure()
        shell: cmd
        run: |
          call Setup.cmd -Demo -NonInteractive || exit /b 1
          call Run.cmd -Demo -OutputPath out\demo-cmd -NoOpen || exit /b 1
          dir /b out\demo-cmd\reports

      - name: Upload demo reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: complaint-dossier-demo
          path: |
            out/demo/reports/*.docx
            out/demo/review-list.xlsx
            out/demo/audit/
            out/demo/runs/
          retention-days: 7
          if-no-files-found: error

      - name: Upload sample run
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: complaint-dossier-sample
          path: out/sample/
          retention-days: 7
          if-no-files-found: error

  scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Employer denylist (files, Office and PDF file contents, full history)
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          terms="$RUNNER_TEMP/denylist.txt"
          printf '%s\n' "$DENYLIST" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$terms"
          if [ ! -s "$terms" ]; then echo "Secret DENYLIST is empty or missing."; exit 1; fi
          git log -p --all > "$RUNNER_TEMP/history.txt"
          : > "$RUNNER_TEMP/office.txt"
          git ls-files '*.docx' '*.xlsx' | while read -r f; do unzip -p "$f" >> "$RUNNER_TEMP/office.txt"; done
          if git ls-files '*.pdf' | grep -q .; then
            command -v pdftotext > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
            git ls-files '*.pdf' | while read -r f; do pdftotext "$f" - >> "$RUNNER_TEMP/office.txt"; done
          fi
          hits=0
          n=0
          while IFS= read -r term; do
            n=$((n + 1))
            if git grep -I -i -F -q -e "$term"; then echo "term $n: hit in tracked files"; hits=1; fi
            if grep -i -F -q -e "$term" "$RUNNER_TEMP/office.txt"; then echo "term $n: hit inside .docx/.xlsx/.pdf"; hits=1; fi
            if grep -i -F -q -e "$term" "$RUNNER_TEMP/history.txt"; then echo "term $n: hit in git history"; hits=1; fi
          done < "$terms"
          echo "Checked $n terms."
          exit $hits

      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
